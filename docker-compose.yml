services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gameit-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_SA_PASSWORD:-StrongDevPassword!2026}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: gameit-api
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "5161:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ConnectionStrings__GameItDbConnectionString: "Server=sqlserver;Database=GameItDb;User Id=sa;Password=${DB_SA_PASSWORD:-StrongDevPassword!2026};TrustServerCertificate=True;"
      JwtSettings__SecretKey: "${JWT_SECRET_KEY:-CHANGE_ME_IN_USER_SECRETS_MIN_32_CHARS_LONG_KEY}"
      JwtSettings__Issuer: "${JWT_ISSUER:-GameIt.Api}"
      JwtSettings__Audience: "${JWT_AUDIENCE:-GameIt.Client}"
      Stripe__SecretKey: "${STRIPE_SECRET_KEY:-sk_test_placeholder}"
      Stripe__PublishableKey: "${STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}"
      Stripe__WebhookSecret: "${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}"
      EmailSettings__ApiKey: "${SENDGRID_API_KEY:-SG.placeholder}"
      Cors__AllowedOrigins__0: "http://localhost:5036"
      Cors__AllowedOrigins__1: "https://localhost:7294"

  blazor:
    build:
      context: .
      dockerfile: Dockerfile.blazor
    container_name: gameit-blazor
    depends_on:
      - api
    ports:
      - "5036:80"

volumes:
  sqlserver_data:
