<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameIt — Digital PC Game Storefront</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="GameIt.BlazorUI.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#09090B;color:#FAFAFA;font-family:'Inter',sans-serif;">
            <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
                <div style="width:40px;height:40px;border-radius:10px;background:#6366F1;display:flex;align-items:center;justify-content:center;font-weight:800;">G</div>
                <span style="font-size:0.85rem;color:#A1A1AA;">Loading GameIt Storefront...</span>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unexpected error occurred in the storefront.
        <a href="" class="reload" style="color:#fff;text-decoration:underline;margin-left:8px;">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
